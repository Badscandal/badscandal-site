# BADSCANDAL — static site, no build step.
# The whole repo root IS the site; Netlify just publishes it as-is.

[build]
  publish = "."
  command = ""

# Server-side only: the visit counter (netlify/functions/hit.mjs + stats.mjs, added 11 Oct 2026).
# Netlify installs @netlify/blobs from package.json for these; nothing reaches the browser.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
