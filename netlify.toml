# BADSCANDAL — static site, no build step.
# The whole repo root IS the site; Netlify just publishes it as-is.

[build]
  publish = "."
  command = ""

# Server-side only (nothing here reaches the browser):
#   netlify/functions/      every function file names its own path or schedule in `export const config`
#                           (hit, capi, admin, hq, staff, bank, feed and the scheduled jobs)
#   netlify/edge-functions/ song-geo.js (country flag for the song pages' consent bar; its path list
#                           is rewritten by tools/new-song.mjs)
# Netlify installs @netlify/blobs from package.json for the functions.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
