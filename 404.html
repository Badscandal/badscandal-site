<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nothing here · BADSCANDAL</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050505">
<link rel="icon" href="/favicon.ico">
<!-- THE "NOT FOUND" PAGE (11 Nov 2026). Netlify serves this file for every address that doesn't
     exist (and for the `/404 404!` lines in _redirects). It can be shown at ANY path, so every
     URL in here is absolute. Deliberately tiny and stand-alone: no site.css, no main.js, no
     visit counter, no images. The film look is drawn in CSS (scanlines + a red glow); the one
     request is the wordmark's typeface, cut down to the ten letters of BADSCANDAL. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,900&text=BADSCANDAL&display=swap" rel="stylesheet">
<style>
:root{--ink:#050505;--paper:#F2F2F2;--uv:#B4B4B4}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ink);color:var(--paper)}
body{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;
  padding:40px 20px calc(40px + env(safe-area-inset-bottom));text-align:center;overflow-x:hidden;
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
/* the film, without the film: a dim red picture behind dark scanlines, darker at the edges */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse at 50% 42%,rgba(5,5,5,0) 0%,rgba(5,5,5,.5) 55%,rgba(5,5,5,.94) 100%),
    repeating-linear-gradient(180deg,rgba(5,5,5,.78) 0 2px,rgba(5,5,5,0) 2px 4px),
    radial-gradient(ellipse at 50% 36%,#8D060C 0%,#4a0508 45%,#160203 100%);
  opacity:.5}
main{position:relative;z-index:1;width:100%;max-width:560px}
.code{font:400 11px/1 ui-monospace,"DM Mono",Menlo,Consolas,monospace;letter-spacing:.12em;
  text-transform:uppercase;color:var(--uv)}
h1{margin:18px 0 0;font-family:"Archivo",Helvetica,Arial,sans-serif;font-weight:900;
  font-variation-settings:"wdth" 125,"wght" 900;font-size:min(9.4vw,64px);line-height:1;
  letter-spacing:-.01em}
.line{margin:22px auto 0;max-width:22em;font-size:18px;color:var(--paper)}
.btn{display:inline-flex;align-items:center;justify-content:center;margin-top:30px;
  padding:19px 44px;border-radius:999px;background:#fff;color:var(--ink);text-decoration:none;
  font-weight:700;font-size:15px;line-height:1;letter-spacing:.16em;text-indent:.16em;
  text-transform:uppercase;box-shadow:0 18px 50px rgba(0,0,0,.55);
  -webkit-tap-highlight-color:transparent;transition:transform .12s ease}
.btn:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){.btn{transition:none}.btn:active{transform:none}}
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>BADSCANDAL</h1>
  <p class="line" id="line">Nothing here. The music is this way.</p>
  <a class="btn" id="go" href="/">Listen</a>
</main>
<script>/* same language rule as the rest of the site: a tapped EN/ES/PT wins, else the device */
(function(){var T={es:["Aquí no hay nada. La música está por aquí.","Escuchar"],pt:["Nada aqui. A música é por aqui.","Ouvir"]},l=null;
try{l=localStorage.getItem("bs_lang")}catch(e){}
if(l!=="en"&&!T[l]){l="en";var p=navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||""];
for(var i=0;i<p.length;i++){var c=String(p[i]||"").toLowerCase().slice(0,2);if(c==="en"||T[c]){l=c;break}}}
if(T[l]){document.documentElement.lang=l;document.getElementById("line").textContent=T[l][0];document.getElementById("go").textContent=T[l][1]}})();</script>
</body>
</html>
