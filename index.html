<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="Clothing for the ones who left. Statement tees and essentials for chasing the thing you actually want, out loud, in front of everybody. Wear the trouble.">
<meta property="og:title" content="BADSCANDAL">
<meta property="og:description" content="You get four thousand weeks. Clothing for spending them on the thing you actually want. Wear the trouble.">
<meta property="og:image" content="assets/hero-film-poster-v6.jpg">
<link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48-v2.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192-v2.png">
<link rel="apple-touch-icon" href="assets/favicon-180-v2.png">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"Organization","name":"BADSCANDAL",
 "url":"https://www.badscandal.com/",
 "logo":"https://www.badscandal.com/assets/favicon-512-v2.png",
 "slogan":"Wear the trouble.",
 "description":"A clothing brand for the ones who left — statement tees and essentials for chasing what you actually want.",
 "founder":{"@type":"Person","name":"Luke Power",
   "url":"https://www.badscandal.com/us.html"},
 "sameAs":["https://instagram.com/lukeandlilian",
   "https://www.tiktok.com/@lukeandlilian",
   "https://youtube.com/@lukeandlilian"]}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=DM+Mono:wght@300;400;500&family=Figtree:wght@300..900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<noscript><style>
/* no JS: the CRT canvas never draws — show the live-text fallback */
.crt canvas{display:none !important}
.crt-fallback{display:block !important}
</style></noscript>
</head>
<body>

<div class="grain" aria-hidden="true"></div>
<div class="blur-veil" aria-hidden="true"></div>

<!-- LANDING (24 Aug 2026 rework): badscandal.com is just the wordmark
     over the film. The entire store-first page — nav taxonomy, shop,
     story strip, marquee, About — lives on store.html now (About is a
     section at the bottom of it: store.html#about-sec). Nav here is
     Home + Store BY DESIGN; no cart, no burger, no footer, no store.js.
     The tagline is .music-line, NOT .hero-line — i18n.js rewrites
     .hero-line to the "Wear the trouble." translations, which belong to
     the store page; .music-line has its own entry there. --------------- -->
<header class="nav">
  <a class="nav-logo" href="#top" aria-label="Badscandal — home">/</a>
  <nav class="nav-links" aria-label="Primary">
    <a class="nav-link roll" href="#top">Home</a>
    <a class="nav-link roll" href="store.html">Store</a>
  </nav>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="en">EN</button><button type="button" data-lang="es">ES</button><button type="button" data-lang="pt">PT</button>
  </div>
</header>

<main id="top">

  <!-- HERO — the film loop + CRT wordmark, full viewport. -----------------
       CACHE RULE: any new hero film/poster needs a NEW filename (assets/*
       is cached immutable for a year) — bump the -vN suffix, never reuse.
       ENCODING RULE: the film must start at 0.000 on a keyframe (see
       CLAUDE.md) or browsers paint a black first frame. Poster = the
       sunset-viewpoint frame; it is what reduced-motion visitors keep
       (main.js cancels autoplay for them). -->
  <section class="hero hero--full" id="hero">
    <video class="hero-photo" autoplay muted loop playsinline preload="auto"
           poster="assets/hero-film-poster-v6.jpg"
           aria-label="BADSCANDAL — the film">
      <!-- phones get the 1080 encode; everything else the 4K -->
      <source src="assets/hero-film-1080-v6.mp4" type="video/mp4"
              media="(max-width: 640px)">
      <source src="assets/hero-film-4k-v6.mp4" type="video/mp4">
    </video>
    <div class="hero-scrim" aria-hidden="true"></div>
    <div class="hero-inner">
      <div class="crt crt-hero"><canvas></canvas><h1 class="crt-fallback" hidden>BADSCANDAL</h1></div>
    </div>
    <p class="music-line">Music that doesn't <span class="em">care</span>.</p>
  </section>

</main>

<script src="js/i18n.js"></script>
<script src="js/main.js"></script>
<script src="js/crt.js"></script>
</body>
</html>
